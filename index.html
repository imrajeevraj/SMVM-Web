<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('smvm-theme');
        const useDarkTheme = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', useDarkTheme);
        } catch (_) {
          // Keep the default light theme when storage is unavailable.
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06152f" />
    <title>SMVM Softwares | Where Creativity Meets Innovation</title>
    <meta name="description" content="SMVM Softwares builds POS products and custom software solutions for modern businesses." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
